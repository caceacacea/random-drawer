name: Release APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Rename APK asset
        run: cp app/build/outputs/apk/debug/app-debug.apk "random-drawer-${GITHUB_REF_NAME}.apk"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "random-drawer-${GITHUB_REF_NAME}.apk" \
            --title "Random Drawer ${GITHUB_REF_NAME}" \
            --notes "Android debug APK for Random Drawer. Download the APK asset below and install it on an Android device with unknown-app installs enabled."
